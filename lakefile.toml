git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f6090c7095e1e56b3464c1daba5f24631f1290d2"

[[lean_lib]]
name = "LorentzianCalderon"
roots = ["LorentzianCalderon.Main"]
globs = ["LorentzianCalderon.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
