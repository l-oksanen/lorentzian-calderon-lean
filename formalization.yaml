related_formalizations: []

status:
  scope: >-
    The challenge theorem LorentzianCalderon.main is proved in full, without
    sorry and with only the axioms propext, Quot.sound and Classical.choice.
    Every result cited from the literature is proved in the formalization, at
    the strength the main theorem needs (docs/weakening.md).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code sessions with parallel subagents in separate git worktrees,
        building with Lake against Mathlib; the human set the statement and the
        direction and reviewed each step.
      cost:
        wall_time: >-
          About 11 hours on a laptop (24–25 November 2026) and about 14 hours on
          an HPC compute node (25–26 November 2026)
        spend_usd: "not tracked"
        hardware: "local machine; HPC compute node with 32 cores and 192 GB"
      prompting_notes: >-
        The paper was turned into a blueprint and the comparator challenge
        with Claude, then agents formalized the proof, first modulo cited
        facts and then proving those facts.
  spend_usd: "not tracked"
  notes: >-
    The challenge was written by Claude in a sequence of interactions with
    the authors. The challenge was reviewed by the authors. The proof was
    written by Claude Code agents.

fidelity:
  divergences: >-
    The main theorem formalizes a special case of Corollary 1.4 of the paper,
    not its main result (Theorem 1.3). Instead of exterior data outside an
    arbitrary compact set, Cauchy data on the boundary of the box
    M₀ = [-T, T] × [-1, 1]ⁿ is considered. Cauchy data is formulated in terms
    of values and differentials instead of the usual (u, ∂_ν u) formulation.

review:
  status: "Comparator challenge was reviewed by the authors"
  reviewers:
    - "Lauri Oksanen"
  notes: >-
    The specialization of Corollary 1.4 of the paper avoids technical
    difficulties but preserves the features of interest.

alignment:
  namespace: "LorentzianCalderon"
  statements:
    - source: "A special case of Corollary 1.4 of the paper"
      lean: "LorentzianCalderon.main"
      module: "Challenge"
      status: "proved"
      note: "Proved in LorentzianCalderon/Main.lean, re-exported by Solution."

acknowledgements: "Mathlib"
