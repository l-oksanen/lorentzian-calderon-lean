# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Uniqueness for the Lorentzian Calderón problem with Minkowski exterior"
  description: >-
    A formal proof of uniqueness for the Lorentzian Calderón problem on a box.
    Let n ≥ 2, let M₀ = [-T, T] × [-1, 1]ⁿ ⊆ ℝ^{1+n}, and let g, g' be smooth
    Lorentzian metrics on ℝ^{1+n} that equal the Minkowski metric outside M₀ and
    are globally hyperbolic (all causal diamonds compact). If the Cauchy data
    sets of the wave equations □_g u = 0 and □_{g'} u = 0 on ∂M₀ coincide, then
    g' pulls back to g under a diffeomorphism of ℝ^{1+n} that is the identity
    outside M₀. The proof develops, on top of Mathlib, the causal theory of such
    metrics (temporal functions, null geodesics and conjugate points), retarded
    solutions of the wave equation, progressing waves with a single front and a
    weighted energy inequality, combined in an induction over the level sets of
    a temporal function.
  authors:
    - "Matti Lassas"
    - "Lauri Oksanen"
    - "Mikko Salo"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lauri Oksanen"

classification:
  arxiv: ["math.AP", "math.DG"]
  msc2020: ["35R30", "35L05", "53C50", "58J45"]

